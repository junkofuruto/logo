name: release

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      bump:
        description: "Force major bump"
        required: false
        default: "minor"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          if [ -n "$(find . -name '*.go' -not -path './.git/*' | head -n1)" ]; then
            go test ./...
          else
            echo "No Go packages found, skipping tests"
          fi

      - name: Tag release
        env:
          DISPATCH_BUMP: ${{ github.event.inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          latest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)

          major=0
          minor=0
          patch=0
          previous=""
          if [ -z "$latest" ]; then
            patch=$(git rev-list --count HEAD)
          else
            previous="$latest"
            core=${latest#v}
            major=${core%%.*}
            rest=${core#*.}
            minor=$((10#${rest%%.*}))
            patch=$(git rev-list --count "$latest..HEAD")
          fi

          is_major=0
          case "$DISPATCH_BUMP" in
            major) is_major=1 ;;
          esac
          if [ "$is_major" -eq 0 ]; then
            if [ -n "$previous" ]; then
              if git log --pretty=%s "$previous..HEAD" | grep -Eq '^(major:|.*BREAKING CHANGE)'; then
                is_major=1
              fi
            else
              if git log --pretty=%s | grep -Eq '^(major:|.*BREAKING CHANGE)'; then
                is_major=1
              fi
            fi
          fi

          if [ "$is_major" -eq 1 ]; then
            major=$((major + 1))
            minor=0
          else
            minor=$((minor + 1))
          fi

          version="v$major.$minor.$patch"
          git tag -a "$version" -m "Release $version"
          git push origin "$version"
          echo "Tagged $version (previous: ${previous:-none}, commits in range: $patch)"

          if [ -n "$previous" ]; then
            git log --pretty="- %s (%h)" "$previous..HEAD" > notes.md
          else
            git log --pretty="- %s (%h)" HEAD > notes.md
          fi
          gh release create "$version" --notes-file notes.md
