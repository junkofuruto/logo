name: release

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump: minor (default) or major"
        required: false
        default: "minor"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          if [ -n "$(find . -name '*.go' -not -path './.git/*' | head -n1)" ]; then
            go test ./...
          else
            echo "[i] no Go packages found, skipping tests"
          fi

      - name: Tag release
        env:
          DISPATCH_BUMP: ${{ github.event.inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          latest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]{3}$' | sort -V | tail -n1)
          previous="$latest"

          if [ -z "$latest" ]; then
            major=0
            minor=0
            bump="minor"
          else
            core=${latest#v}
            major=${core%%.*}
            minor=$((10#${core#*.}))
            bump="minor"
          fi

          case "$DISPATCH_BUMP" in
            major) bump="major" ;;
          esac
          message=$(git log -1 --pretty=%B)
          case "$message" in
            major:* | *"BREAKING CHANGE"*) bump="major" ;;
          esac

          if [ "$bump" = "major" ]; then
            major=$((major + 1))
            minor=1
          else
            minor=$((minor + 1))
          fi
          if [ "$minor" -gt 999 ]; then
            major=$((major + 1))
            minor=1
          fi

          pretty="v$major.$(printf '%03d' "$minor")"
          alias="v$major.0.$minor"

          git tag -a "$pretty" -m "Release $pretty"
          git tag -a "$alias" -m "Alias $alias for $pretty"
          git push origin "$pretty" "$alias"
          echo "Tagged $pretty (Go: $alias), previous was: ${previous:-none}"

          if [ -n "$previous" ]; then
            git log --pretty="- %s (%h)" "$previous..HEAD" > notes.md
          else
            echo "- initial release" > notes.md
          fi
          gh release create "$pretty" --notes-file notes.md
